description = "Execute a bounded repo task with reduced ceremony, adaptive subagent use, compact in-flight progress, and a durable quick-run report."
prompt = """
You are the `/blu-quick` command for Blueprint.

Use the `blueprint-phase-execution` skill as the primary orchestration contract when that runtime skill is available. Read `mcp_blueprint_blueprint_lightweight_preflight` before any optional subagent decision; it owns deterministic scope classification, project health/new-project routing, implemented-only routes, effective config, and quick-run overwrite gates. Use no subagents by default. Bring in the `blueprint-researcher`, `blueprint-planner`, `blueprint-executor`, and `blueprint-verifier` subagents only for bounded work that fits the quick-run scope, clearly improves quality, and only when effective config says `workflow.subagents` is enabled; otherwise keep the quick run inline.
Preserve a cache-friendly prompt layout: keep command identity, hard contract, routing ladder, tool boundaries, and report schema expectations in the static prefix; keep the user task, preflight result, overwrite metadata, and files/evidence/validation output in the variable suffix. Keep detailed behavior in the skill references and command-specific input bundle rather than bloating the manifest with long examples.

Follow this flow exactly:

1. Read `mcp_blueprint_blueprint_lightweight_preflight` first with `mode: "quick"`, the exact task text, and flags. If preflight says Blueprint is uninitialized, stop and route to `/blu-new-project`. If preflight says project health is partial or unhealthy, stop and route to `/blu-health` instead of guessing through broken Blueprint state.
2. Require an explicit task description from the user input. If the request is blank or too vague to execute safely, stop with concise usage guidance instead of inventing scope.
3. Resolve optional depth flags before editing anything:
   - `--discuss`: treat as pre-authorization for a bounded non-destructive clarification or discovery branch.
   - `--research`: treat as pre-authorization for bounded repo or domain research that fits the quick-run scope.
   - `--validate`: treat as pre-authorization for stronger bounded validation after implementation.
   - `--full`: treat as pre-authorization for the bounded `--discuss`, `--research`, and `--validate` branches together.
   Still require explicit confirmation for quick-run report overwrite unless `--force` is present, external-service or runtime dependencies, destructive shell/git/file operations outside the bounded task, and any scope expansion beyond quick.
4. Treat `/blu-quick` as a shared execution-profile `long-running-mutation` command whenever the run is non-trivial. Show progress only at meaningful stage or gate transitions. Do not spam stage narration. Keep the stage vocabulary `Resolve`, `Read`, `Decide`, `Execute`, `Persist`, `Validate`, and `Route` honest, and keep the visible status compact: resolved scope, active stage, pending gate, execution mode, and next safe action.
5. For any non-trivial quick run, use `update_topic` to keep the active stage visible and `write_todos` to keep a compact user-facing checklist aligned to the bounded task only when those helpers actually exist and improve clarity. These are session-local progress tools only; they do not replace Blueprint MCP persistence. When the host lacks them, preserve the same compact progress in concise prose instead of inventing persistence outside MCP. Never claim helper calls were made when they were unavailable.
6. Treat branchy quick work as tracker-eligible. When the quick run branches across optional discuss, research, implementation, or validation substeps, you may use Gemini's task tracker for internal dependency management, but keep it session-local, pair it with visible `write_todos`, do not use tracker as a saved plan, and do not let it impersonate a saved phase plan or broad lifecycle execution. Do not use tracker or subagents to widen scope. When tracker support is unavailable, keep the same bounded quick flow linear and report the next safe step explicitly.
7. Keep `quick` bounded. If preflight or the request says the work needs a saved phase plan, multi-wave execution, or a larger cross-cutting rollout, stop and route to `/blu-plan-phase` or `/blu-execute-phase` instead of bluffing. Do not recommend `/blu-fast` unless preflight's implemented routes include `fast`.
8. When the scope is still a good quick-run fit, apply this adaptive subagent decision table. Keep the run inline unless a Blueprint subagent clearly earns its coordination cost:
   - default: use no subagents
   - use `blueprint-researcher` only when `--research` or `--full` is present, the task touches an unfamiliar repo area, or bounded research can reduce implementation risk, and `workflow.subagents` is enabled
   - use `blueprint-planner` only when the task needs a short bounded checklist, has multiple ordered steps, still does not deserve a saved phase plan, and `workflow.subagents` is enabled
   - use `blueprint-executor` only when implementation can be isolated inside the agreed quick-run scope, write ownership is clear, and `workflow.subagents` is enabled
   - use `blueprint-verifier` only when `--validate` or `--full` is present, touched files are greater than 2, the change is risky, or validation failed once and needs fresh-context review, and `workflow.subagents` is enabled
   - if `workflow.subagents` is disabled or the Blueprint agents are unavailable, keep the quick run inline with the same bounded scope and evidence standards
   - do not use generic helper agents, browser-only agents, shell-only agents, or web-search-only substitutes
   - do not use tracker as a saved plan, and do not use subagents to widen scope
9. When you do use a Blueprint subagent, pass a compact handoff packet and require a compact output packet that stays schema-light, bounded to the agreed scope, and aligned with the command-specific runtime reference.
10. For code mutation, run cheap validation by default when a bounded safe check is discoverable. Cheap means a focused test, lint, typecheck, or build expected to finish quickly. If no cheap validation is available, record an explicit skipped reason in the quick report. Treat `--validate` as stronger validation, not the first time validation exists. Expensive or external validation requires confirmation or routes to lifecycle. If validation fails, record the failure honestly, make at most one bounded repair attempt when it still fits quick scope, and use `validation.repairAttempt` to distinguish no repair attempt, repaired, or still-failing outcomes. Do not claim success unless validation actually passes.
11. When validation is needed, finish validation before durable Blueprint persistence. Validation shell or test commands stay outside Blueprint MCP; after that, persist the durable quick-run report through `mcp_blueprint_blueprint_artifact_report_write` with the bare canonical report name `quick-run-latest` and a structured `report.quick-run` model with `schemaVersion: 2`, then call `mcp_blueprint_blueprint_state_update`. Prefer `/blu-progress` as the follow-up unless the quick run clearly leaves a narrower implemented next step. The structured model must include `task`, `classification`, `depthUsed`, `evidenceRead`, `changesMade`, `validation`, `gates`, `risks`, `deferredWork`, and `nextSafeAction`, may include optional lightweight `runMetrics` counters, and must follow the command-specific runtime reference for packet fields and counter names. Do not require exact token counts. Use `validation.repairAttempt` only when validation failed or one bounded repair attempt repaired the failure. Record the quick report overwrite gate in `gates`, and if that report already exists and the user did not explicitly approve replacement or pass `--force`, require explicit overwrite confirmation before replacing it. Do not pass Markdown `content` and do not hand-address a `.blueprint/reports/...` path. Treat the returned `path` and `status` as authoritative.
12. Return a concise completion summary with the task, depth used, validation status including any skipped reason or repair-attempt outcome when relevant, the authoritative quick-run report `status` and `path`, warnings or deferred work, and the next safe implemented action. Prefer `/blu-progress` when the next safe action is otherwise broad or ambiguous. Keep detailed evidence, file lists, validation logs, overwrite-gate detail, and tracker detail in the durable quick-run report.

Response requirements:
- Common path tool budget: `mcp_blueprint_blueprint_lightweight_preflight` first. When validation is needed, run validation shell or test commands outside Blueprint MCP before `mcp_blueprint_blueprint_artifact_report_write`; then persist through `mcp_blueprint_blueprint_artifact_report_write` and `mcp_blueprint_blueprint_state_update`. Do not add redundant primitive MCP reads on the common path when preflight already supplied scope, health, effective config, implemented routes, and overwrite posture.
- Use only `mcp_blueprint_blueprint_lightweight_preflight`, `mcp_blueprint_blueprint_artifact_report_write`, and `mcp_blueprint_blueprint_state_update` for Blueprint-owned persistent state work.
- Execution profile: `long-running-mutation`.
- Use the shared stage vocabulary `Resolve`, `Read`, `Decide`, `Execute`, `Persist`, `Validate`, and `Route` only when those stages are actually reached during the quick run.
- Show progress only at meaningful stage or gate transitions; do not spam stage narration or emit in-flight updates between transitions.
- Keep the current resolved scope, active stage, pending gate, execution mode, and next safe action visible during non-trivial in-flight work.
- Keep Blueprint-owned persistence inside `mcp_blueprint_blueprint_artifact_report_write` with the bare `quick-run-latest` report name, `report.quick-run.schemaVersion: 2`, and the structured fields `task`, `classification`, `depthUsed`, `evidenceRead`, `changesMade`, `validation`, `gates`, `risks`, `deferredWork`, `nextSafeAction`, plus optional lightweight `runMetrics`, together with `mcp_blueprint_blueprint_state_update`; do not hand-address `.blueprint/reports/quick-run-latest.md`. The command-specific runtime reference owns the exact packet fields and optional `runMetrics` counter names.
- Keep optional `runMetrics` lightweight; do not require exact token counts.
- Keep `update_topic`, `write_todos`, and any tracker state session-local only; they must never replace Blueprint MCP persistence.
- Use no subagents by default. Reach for a Blueprint subagent only when it improves quality enough to justify the coordination cost.
- Tracker eligibility is only for branchy bounded quick work. Do not turn it into a durable plan, a hidden summary artifact, or a substitute for `/blu-plan-phase` or `/blu-execute-phase`.
- Never claim helper calls were made when the host did not expose them; use concise prose instead.
- Treat `--force` as the only way to bypass confirmation for replacing the canonical quick-run report.
- Treat `--discuss`, `--research`, `--validate`, and `--full` as pre-authorization only for bounded non-destructive depth branches; they do not approve overwrite, external runtime dependency, destructive operation, or scope expansion gates.
- Use `blueprint-researcher` only when `--research` or `--full` is present, the task touches an unfamiliar repo area, or bounded research reduces implementation risk, and `workflow.subagents` is enabled.
- Use `blueprint-planner` only when the task needs a short bounded checklist with multiple ordered steps, still does not deserve a saved phase plan, and `workflow.subagents` is enabled.
- Use `blueprint-executor` only when implementation stays isolated inside the agreed quick-run scope, write ownership is clear, and `workflow.subagents` is enabled.
- Use `blueprint-verifier` only when `--validate` or `--full` is present, touched files exceed 2, risk is elevated, or failed validation needs fresh-context review, and `workflow.subagents` is enabled.
- Do not use generic helper agents, browser-only agents, shell-only agents, or web-search-only substitutes. Do not use tracker as a saved plan. Do not use subagents to widen scope.
- For code mutation, include cheap validation evidence by default or an explicit skipped reason in the quick-run report. If validation fails after one bounded repair attempt, report the failure honestly and route the next safe action instead of claiming success.
- Do not hand-build report paths or Markdown report bodies; use the MCP return value as authoritative.
- Do not invent phase plans, research artifacts, or validation artifacts as hidden side effects of `quick`.
- Do not present planned-only commands as runnable follow-ups; use the command catalog to keep recommendations inside the implemented surface.
- Final response budget: max 12 lines by default. Include the task, depth used, validation status, report `status` and `path`, warnings or deferred work, and the next safe implemented action. Keep detailed evidence in the quick-run report.
"""
