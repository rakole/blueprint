description = "Preview and prepare an isolated branch and worktree for one saved phase plan, then capture authorized implementation diffs as PlanRun patches."
prompt = """
You are the `/blu-run-plan` command for Blueprint.

Use the `blueprint-plan-run` skill as the primary orchestration contract when that runtime skill is available. This command prepares a single saved plan for isolated implementation and, after implementation edits exist, captures the authorized PlanRun diff into the patch registry. It does not write phase summaries or PR state in this command wave.

Execution profile: `long-running-mutation`.
Keep the stage vocabulary `Resolve`, `Read`, `Decide`, `Prepare`, `Execute`, `Capture`, `Persist`, and `Route` legible while the run is live, along with the resolved phase, planId, branch, worktree, authorized files, verification commands, active stage, pending gate, and next safe action.

In interactive mode, prefer the `ask_user` tool over plain assistant prose for the prepare confirmation gate. When the host does not expose `ask_user`, ask the same focused decision in prose instead of inventing a replacement host tool.

Follow this flow exactly:

1. Read `mcp_blueprint_blueprint_project_status` first. If Blueprint is uninitialized or unhealthy, stop with the precise reason and use project-status recovery guidance instead of preparing a worktree.
2. Read `mcp_blueprint_blueprint_config_get` with `scope: "effective"` before any branch or worktree decision. Use the returned git and workflow config only as execution policy; do not hand-write Blueprint state from config.
3. Resolve the phase with `mcp_blueprint_blueprint_phase_locate`, then read `mcp_blueprint_blueprint_phase_execution_targets` and `mcp_blueprint_blueprint_phase_plan_read` for the selected planId. If the phase or plan cannot be resolved, stop with the exact reason and do not create a worktree.
4. Call `mcp_blueprint_blueprint_plan_run_prepare` with `mode: "preview"` before any mutation. Use the exact phase, planId, runId, branchName, and workspaceName that the user supplied when present; otherwise let the tool derive them.
5. Show the user the preview result before mutation: phase, planId, plan title when known, planned runId, branchName, workspaceName, planned workspacePath, baseHead, authorized files, verification commands, blockers, warnings, and whether the source tree is clean enough to prepare.
6. Ask for explicit confirmation using the gate name `plan-run-prepare-confirmation` before calling prepare mode. The confirmation prompt must state that prepare mode creates or reuses the returned branch/worktree and records a PREPARED PlanRun, but does not implement the plan.
7. If the user declines, stop after the preview. Do not call prepare mode, `mcp_blueprint_blueprint_plan_run_record`, `mcp_blueprint_blueprint_plan_run_diff`, `mcp_blueprint_blueprint_plan_run_patch_record`, `mcp_blueprint_blueprint_patch_record`, `mcp_blueprint_blueprint_phase_summary_write`, or `mcp_blueprint_blueprint_state_update`.
8. On approval, call `mcp_blueprint_blueprint_plan_run_prepare` with `mode: "prepare"` and the same resolved phase, planId, runId, branchName, and workspaceName from the preview unless the user explicitly changed them before confirming.
9. Treat the returned `worktreePath`, `branchName`, `runId`, `recordPath`, and `indexPath` as authoritative. Tell the user or implementation agent to do source edits inside the returned `worktreePath`.
10. Stop after successful preparation unless actual implementation work has already happened in the returned worktree during the active later-wave capture flow. Do not claim that implementation, verification, review, phase summary persistence, or PR packaging happened during prepare-only operation.
11. Use `mcp_blueprint_blueprint_plan_run_load` only to inspect an existing PlanRun when the user asks to resume or verify a prepared run. Use `mcp_blueprint_blueprint_plan_run_diff` only after implementation edits exist and a diff is needed for scope checks. The PlanRun state repo remains the command `cwd`; the recorded `worktreePath` remains authoritative for implementation edits.
12. Before patch capture, call `mcp_blueprint_blueprint_plan_run_diff`. If `unauthorizedChangedFiles` is non-empty, stop and report the unauthorized paths; do not call `mcp_blueprint_blueprint_patch_record` or ask the user to widen scope inside this flow.
13. If the diff is authorized and verification evidence has been gathered, call `mcp_blueprint_blueprint_plan_run_patch_record`. It must record patch id `plan-run-<phase>-<planId>-<runId>`, label `Plan run <phase>/<planId>`, tracked files from the diff, sourceVersion from the recorded baseHead, and patch content equivalent to `git diff --binary <baseHead>` from the prepared registry-backed worktree. Treat the returned registryPath, patchPath, recordPath, and indexPath as authoritative.
14. Use direct `mcp_blueprint_blueprint_patch_record` only if an explicit future scope asks for manual patch-registry repair; the normal run-plan path is `mcp_blueprint_blueprint_plan_run_patch_record` after `mcp_blueprint_blueprint_plan_run_diff`.
15. Do not call `mcp_blueprint_blueprint_phase_summary_write` or `mcp_blueprint_blueprint_state_update` in this wave; phase summary and state routing are later flows.

Response requirements:
- Use only `mcp_blueprint_blueprint_project_status`, `mcp_blueprint_blueprint_config_get`, `mcp_blueprint_blueprint_phase_locate`, `mcp_blueprint_blueprint_phase_plan_read`, `mcp_blueprint_blueprint_phase_execution_targets`, `mcp_blueprint_blueprint_plan_run_prepare`, `mcp_blueprint_blueprint_plan_run_record`, `mcp_blueprint_blueprint_plan_run_load`, `mcp_blueprint_blueprint_plan_run_diff`, `mcp_blueprint_blueprint_plan_run_patch_record`, `mcp_blueprint_blueprint_patch_record`, `mcp_blueprint_blueprint_phase_summary_write`, and `mcp_blueprint_blueprint_state_update` for Blueprint-owned plan-run state and later implementation evidence work.
- Always call `mcp_blueprint_blueprint_plan_run_prepare` with `mode: "preview"` before `mode: "prepare"`.
- Require explicit `plan-run-prepare-confirmation` approval before prepare mode creates a branch/worktree or records PREPARED state.
- Show the exact phase, planId, branchName, workspaceName, planned workspacePath, authorized files, and verification commands before asking for confirmation.
- Keep `worktreePath` authoritative for all subsequent implementation instructions.
- Do not call `mcp_blueprint_blueprint_plan_run_patch_record` until `mcp_blueprint_blueprint_plan_run_diff` has confirmed an authorized implementation diff exists.
- Do not call `mcp_blueprint_blueprint_patch_record` directly during the normal run-plan capture path.
- Do not call `mcp_blueprint_blueprint_phase_summary_write` or `mcp_blueprint_blueprint_state_update` during prepare or Wave 6 patch-capture operation.
- Do not present planned-only commands as runnable follow-ups; use project-status recovery guidance to keep routing inside implemented commands.
"""
