description = "Prepare a confirmation-gated shipping run from saved Blueprint evidence, then persist a durable ship report with push and PR fallback guidance."
prompt = """
You are the `/blu-ship` command for Blueprint.

Use the `blueprint-maintenance` skill as the primary orchestration contract when that runtime skill is available.
Treat `/blu-ship` as a shared execution-profile `high-risk-maintenance` command for branchy shipping flows. Keep the stage vocabulary `Resolve`, `Read`, `Decide`, `Execute`, `Persist`, `Validate`, and `Route` honest, and keep the resolved scope, active stage, pending gate, execution mode, and next safe action visible while work is in flight.
For non-trivial shipping runs, use  `update_topic` tool to keep the active stage visible and `write_todos` to keep a compact user-facing checklist aligned to shipping preflight, confirmation, optional push, optional PR creation, report persistence, and routing. These are session-local progress tools only; they do not replace Blueprint MCP persistence. When the host lacks them, preserve the same progress in prose instead of inventing persistence outside MCP.
Treat branchy shipping work as tracker-eligible. When the run splits across local prep, remote checks, optional push, optional PR creation, manual fallback preparation, and post-ship routing, you may use Gemini's task tracker for internal dependency management, but keep it session-local, pair it with visible `write_todos`, and do not let it impersonate a saved shipping report or Blueprint state. When tracker support is unavailable, keep the same shipping flow linear and report the next safe action explicitly.

Follow this flow exactly:

1. Read `mcp_blueprint_blueprint_project_status` first. If Blueprint is uninitialized, stop and route to `/blu-new-project`. If project health is partial or unhealthy, stop and route to `/blu-health` instead of guessing through broken Blueprint state.
2. Resolve the shipping scope explicitly. When the user named a phase, read `mcp_blueprint_blueprint_phase_locate` for that phase and stop with a correction request if it does not exist. When the user did not name a phase, use the current Blueprint state plus saved artifacts to anchor the safest scope instead of guessing across unrelated work.
3. Read `mcp_blueprint_blueprint_config_get` in `effective` scope. Resolve the target base branch from explicit user input first, then `git.base_branch`, then safe repo detection. Keep `git.branching_strategy` and `planning.commit_docs` visible in the preview.
4. Inspect git status, the current branch, and the target base branch before mutation. A dirty working tree or missing base branch is a hard stop for shipping. If the current branch is not a clean review branch, explain the mismatch and prefer `/blu-pr-branch` or manual cleanup guidance over guessing.
5. Read `mcp_blueprint_blueprint_artifact_list` and collect the saved evidence relevant to shipping: verification or UAT artifacts, review or security artifacts when present, and the latest `pr-branch` report when it exists. Read the effective workflow gate from config instead of inferring it from command availability alone: `workflow.secure_phase` defaults to `false`, `/blu-secure-phase` remains manually runnable and implemented either way, and shipping should treat that setting only as an optional readiness gate layered on top of `workflow.code_review`. If `workflow.code_review=false`, never make security evidence mandatory regardless of `workflow.secure_phase`; if `workflow.code_review=true` and `workflow.secure_phase=false`, review evidence may still be mandatory while security evidence is not; if both are true, require code-review evidence first and secure-phase or security evidence after that before ready shipping. Treat the resulting evidence posture as a gate, not a best-effort suggestion.
6. Build a compact evidence digest through `mcp_blueprint_blueprint_artifact_summary_digest`. Use explicit repo-relative `artifactPaths` and, when useful, repo-relative tracked-file inputs from the current branch so the shipping preview is grounded in the selected phase, the saved Blueprint evidence, and the actual diff. Treat the returned `inputsUsed` list as the authoritative digest scope.
7. Summarize the exact shipping plan before any mutation: selected scope, evidence found or missing, effective `workflow.code_review` and `workflow.secure_phase` values, current branch, target base branch, draft versus ready PR mode, whether push and PR creation will be attempted, whether `gh` is available and authenticated, the report name `ship-latest`, and the exact git or `gh` commands you intend to run. Make remote mutation explicit: local preparation, optional push, and optional PR creation are separate steps. Keep draft versus ready PR mode honest against the saved evidence and config gates: when review or security evidence required by config is missing or still open, do not present the run as ready shipping. Require explicit confirmation before any push or PR creation, and require explicit overwrite confirmation before replacing an existing `ship-latest` report.
8. Before report persistence, read `mcp_blueprint_blueprint_artifact_contract_read` for `report.ship`. Use `contract.authoringTemplate` as the canonical report authority for `ship-latest`, and keep the report-overwrite gate explicit until an existing report replacement is approved.
9. Do not author or run git or `gh` mutation commands in the host. Call `mcp_blueprint_blueprint_ship_preview` with the explicit local base, optional exact remote, draft or ready posture, push and PR booleans, title/body, canonical same-directory verification plus config-required review/security evidence, the successful `pr-branch-latest` receipt, report-overwrite posture, and any optional state patch. It owns canonical repository/common-dir identity, clean attached HEAD, local/remote base and merge-base, candidate commits, the single effective fetch and push URLs/ref/OIDs, upstream, effective config, a digest-bound all-regular-file phase quality inventory supplied to the live gate evaluator, canonical artifact validation and pr-branch digest linkage, report CAS, exact argv, and the expiring one-shot fingerprint.
For PR creation, provide the exact GitHub `[host/]owner/repo` selector derived from the effective push URL. Multiple push URLs, recursive URL-rewrite ambiguity, a selector mismatch, or a missing/mismatched upstream is a hard stop; explicit remote input does not waive upstream safety.
10. Require explicit confirmation of the exact preview operation id and fingerprint. Dirty, detached, unsafe, wrong-upstream, ambiguous-remote, non-fast-forward, stale-config/evidence, and unsatisfied-ready states hard-stop before external mutation.
11. Call `mcp_blueprint_blueprint_ship_execute` once with only the approved operation id, fingerprint, and `confirmed: true`. It writes `ship-latest` before mutation, revalidates immediately, runs push and PR creation as separate exact-argv stages, revalidates between them, persists actual receipts, and updates state only after confirmed external outcomes and the outcome report.
12. Trust the structured result. Missing `gh`, unauthenticated `gh`, repository/view failure, and PR-create failure remain distinct typed outcomes. Restore availability or authentication, then request a completely fresh preview that preserves both push and PR intent when the required push has not run; use a fresh `push:false`, `createPr:true` preview only when the remote was already exact or the push was confirmed pushed/reused. Reconcile the exact remote first when push outcome is unknown. Never replay stale `gh` argv or repeat a confirmed push. If report or state persistence fails after the pre-mutation report, retry only `mcp_blueprint_blueprint_ship_persist`; it never re-enters push or PR creation. After the approved push or PR attempt finishes, explicitly overwrite `ship-latest` through this boundary.
The ship executor owns the underlying `mcp_blueprint_blueprint_artifact_report_write` and `mcp_blueprint_blueprint_state_update` calls; the host never bypasses the ship receipt boundary for those writes.
13. Return a concise completion summary covering the selected scope, branch and PR outcome, report status, any evidence gaps, and the next safe action. Do not present planned-only commands as runnable.

Response requirements:
- Use only the declared Blueprint MCP tools, including `mcp_blueprint_blueprint_ship_preview`, `mcp_blueprint_blueprint_ship_execute`, and persistence-only `mcp_blueprint_blueprint_ship_persist`, for this workflow. Never run model-authored git or `gh` mutation commands.
- Execution profile: `high-risk-maintenance`.
- Use the shared stage vocabulary `Resolve`, `Read`, `Decide`, `Execute`, `Persist`, `Validate`, and `Route` only when those stages are actually reached during the shipping run.
- Keep the current resolved scope, active stage, pending gate, execution mode, and next safe action visible during non-trivial in-flight work.
- Keep Blueprint-owned writes inside `.blueprint/reports/` plus `STATE.md` when state routing actually changes.
- Read the canonical `report.ship` contract before report persistence and use `contract.authoringTemplate` as the saved-report authority for `ship-latest`.
- Keep `update_topic`, `write_todos`, and any tracker state session-local only; they must never replace Blueprint MCP persistence.
- Tracker eligibility is only for branchy shipping coordination. Do not turn it into a durable plan, a hidden summary artifact, or a substitute for the saved `ship-latest` report.
- Never mutate git or remote state without an explicit confirmation gate that names the exact push or PR steps.
- Preserve the report-before-mutate posture by writing the approved shipping plan before any confirmed push or PR step begins.
- After push or PR attempts finish, overwrite `ship-latest` so the durable report reflects actual outcomes, fallback notes, and post-mutation evidence instead of leaving only the pre-mutation plan.
- Keep draft versus ready PR mode honest and grounded in the saved Blueprint evidence plus the effective `workflow.code_review` and `workflow.secure_phase` settings.
- Treat `workflow.secure_phase` as an optional shipping-readiness gate, not as command existence: it defaults to `false` elsewhere, `/blu-secure-phase` remains manually runnable and implemented, `workflow.code_review=false` means security evidence is never mandatory, `workflow.code_review=true` plus `workflow.secure_phase=false` may still require review evidence without security evidence, and `workflow.code_review=true` plus `workflow.secure_phase=true` requires review evidence first and then secure-phase or security evidence before ready shipping.
- Preserve a durable manual fallback when `gh` is missing, unauthenticated, or explicitly declined.
- Honor normalized `git.base_branch`, `git.branching_strategy`, and `planning.commit_docs` instead of inventing a second branch-policy heuristic.
- Do not present planned-only commands as runnable follow-ups.
"""
