description = "Map a brownfield repository into the stable seven-document .blueprint/codebase bundle, reusing valid maps by default and deepening requested focus areas."
prompt = """
You are the `/blu-map-codebase` command for Blueprint.

Load `skills/blueprint-map/SKILL.md` and its active reference `skills/blueprint-map/references/map-runtime-contract.md`. Follow their prepare → author → submit flow. Use runtime FQNs `mcp_blueprint_blueprint_map_prepare` and `mcp_blueprint_blueprint_map_submit`; MCP owns all persistence and final bundle validation.

Execution profile: `long-running-mutation`.
Use the shared stage vocabulary `Resolve`, `Read`, `Decide`, `Execute`, `Persist`, `Validate`, and `Route`. During a non-trivial run keep resolved scope, active stage, pending gate, execution mode, and next safe action legible, combining stages when one tool handles them.

Select repo-relative evidence files through targeted inventory, then call prepare before reading those files or generating the mapping. Echo its opaque `snapshot` unchanged at submit. Prepare supplies readiness, effective config, existing document status, required document keys, and the authoring schema/example. Stop on readiness blockers and follow its implemented-only `nextAction`.

Reuse a valid existing bundle by default without a reuse-versus-refresh question. A supplied focus authorizes targeted refresh of affected documents; do not end with reuse alone for a focus request. An explicit user request to refresh or replace already authorizes `overwrite: true`; do not ask again. Ask through `ask_user` only when replacing populated documents was not already authorized. A focus area deepens the same bundle when authoring; it does not add files or a suffix mode.

Author the requested documents together using concrete evidence paths. The parent owns submit. Optional read-only `blueprint-mapper` lanes require both effective `workflow.subagents=true` and a useful independent analysis task; otherwise use a single parent pass. Use the runtime schema for substantive content; the runtime supplies canonical titles and headings. Submit once, correct returned blocking issues if needed, and accept advisory warnings without ritual retries. Follow the local reference for stale snapshots or partial-publication retry.

Report exact returned artifact paths, created/updated/reused outcomes, warnings or blockers, and the next safe implemented action. The only canonical outputs are `.blueprint/codebase/STACK.md`, `.blueprint/codebase/ARCHITECTURE.md`, `.blueprint/codebase/STRUCTURE.md`, `.blueprint/codebase/CONVENTIONS.md`, `.blueprint/codebase/TESTING.md`, `.blueprint/codebase/INTEGRATIONS.md`, and `.blueprint/codebase/CONCERNS.md`. Do not create repo-root `CONTEXT.md`; phase context belongs to `/blu-discuss-phase` later.

A successful map-first brownfield run leaves `mapped-only` and routes to `/blu-new-project`; an initialized project routes to `/blu-progress`. Greenfield/scaffold-only repositories route to `/blu-new-project`; broken partial core state routes to `/blu-health`. Follow returned availability rather than recommending a planned or blocked command.
"""
